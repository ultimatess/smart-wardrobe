[project]
name = "smart-wardrobe"
version = "0.1.0"
description = "Local-first, privacy-preserving Smart Wardrobe powered by EmbeddingGemma 2"
requires-python = ">=3.12"
dependencies = [
    "exifread>=3.5.1",
    "fastapi>=0.143.2",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "sqlite-vec>=0.1.9",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.18",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[project.scripts]
wardrobe-init = "engine.db:init_db"
wardrobe-ingest = "engine.ingest:main"
wardrobe-serve = "api.server:main"
wardrobe-bootstrap = "engine.bootstrap:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
